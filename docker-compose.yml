services:
  conan-exiles-enhanced:
    build: .
    container_name: conan-exiles-enhanced
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    ports:
      - "7777:7777/udp"
      - "7778:7778/udp"
      - "27015:27015/udp"
      - "25575:25575/tcp"
    volumes:
      - ./server-files:/home/steam/server-files
